name: Refresh recent Laurent phenomenon papers

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: read

concurrency:
  group: lpa-paper-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            /components/lpa-sources.mjs
            /components/update-lpa-papers.mjs
            /assets/lpa-papers.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Refresh the recent-paper snapshot
        run: node components/update-lpa-papers.mjs
      - name: Save only the updated paper data
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add -- assets/lpa-papers.json
          if git diff --cached --quiet -- assets/lpa-papers.json; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Refresh recent Laurent phenomenon papers' -- assets/lpa-papers.json
          git pull --rebase origin "$DEFAULT_BRANCH"
          git push origin "HEAD:$DEFAULT_BRANCH"
      # A GITHUB_TOKEN push does not trigger branch-based Pages on its own.
      - name: Publish the updated search
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --jq '{status,url}'
